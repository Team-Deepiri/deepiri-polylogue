# Exclude generated/build/runtime artifact paths.
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/logs/**'
  - '**/*.min.js'
  - '**/*.pyc'
  - '**/__pycache__/**'
  - 'native/polybridge/*.o'
  - 'native/polybridge/*.so'
  - '**/.mypy_cache/**'
  - '**/.pytest_cache/**'

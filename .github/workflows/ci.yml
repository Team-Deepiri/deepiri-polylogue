name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: make PYTHON=python test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Pin: ruff 0.16+ enables rules that trip existing PolyBridge code.
      - run: pip install "ruff>=0.15.20,<0.16"
      - run: make PYTHON=python lint

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are failures)
        run: make -C native/polybridge CFLAGS="-Wall -Wextra -Werror -O2 -std=c99 -D_DEFAULT_SOURCE"
      - name: Unit and end-to-end tests
        run: make -C native/polybridge test
      - name: Tests under ASan/UBSan
        run: make -C native/polybridge test-asan
      # clang on the GitHub Linux images does ship the libFuzzer runtime, so
      # this is the coverage-guided run the macOS/BSD dev boxes cannot do.
      - name: Fuzz the frame parsers
        run: |
          make -C native/polybridge CC=clang fuzz
          cd native/polybridge
          ./fuzz_frames -max_total_time=60 -print_final_stats=1
          ./fuzz_client -max_total_time=60 -print_final_stats=1

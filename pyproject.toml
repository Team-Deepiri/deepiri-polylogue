[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepiri-polylogue"
version = "0.3.2"
description = "Filesystem-first shared journal so many LLM surfaces stay mutually aware (Deepiri)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=12.0"]
license = { text = "Apache-2.0" }
authors = [{ name = "Deepiri" }]
keywords = ["llm", "multi-agent", "sync", "deepiri", "journal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
polylogue = "polylogue.__main__:main"
deepiri-polylogue = "deepiri_polylogue.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "redis", "pyyaml", "websockets>=12.0"]
redis = ["redis"]
pyyaml = ["pyyaml"]

[project.urls]
Homepage = "https://github.com/deepiri/deepiri-polylogue"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
